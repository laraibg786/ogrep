name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  lint-build-test:
    name: Lint, build, and test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      - name: Cross-compile sanity check
        # This project cross-compiles release binaries for
        # linux/darwin/windows (amd64/arm64) via goreleaser, so a
        # platform-specific compile break is worth catching before
        # release time. Go's cross-compiler makes this a non-issue to
        # check cheaply: CGO_ENABLED=0 + GOOS/GOARCH lets one ubuntu
        # runner compile for every target without ever booting an
        # actual macOS/Windows VM, which would burn CI minutes at
        # GitHub's higher per-minute multiplier for those runners for
        # no real benefit — go build's cross-compiler output is the
        # same regardless of host OS.
        run: |
          set -e
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            echo "Building for $goos/$goarch..."
            out="/tmp/ogrep-$goos-$goarch"
            [ "$goos" = "windows" ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o "$out" ./cmd/ogrep
          done
