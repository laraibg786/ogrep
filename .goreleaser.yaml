# goreleaser configuration for ogrep.
#
# This targets the goreleaser v2 config schema (v1 configs are
# deprecated as of goreleaser v2). See https://goreleaser.com for the
# full schema reference.
#
# Local/dry-run usage (no git tag, no remote, no token required):
#
#   goreleaser release --snapshot --clean --skip=publish
#
# Real release usage (once this repo has a git remote and a
# GITHUB_TOKEN with repo scope — neither exists yet):
#
#   git tag vX.Y.Z && git push --tags
#   goreleaser release --clean
version: 2

project_name: ogrep

before:
  hooks:
    - go mod tidy

builds:
  - id: ogrep
    main: ./cmd/ogrep
    binary: ogrep
    # Statically-linked, no-libc binaries: CGO must be off for every
    # target so the same build works whether or not a C toolchain is
    # even installed on the build host, and so the resulting binary has
    # no runtime dependency on glibc/musl.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # No excludes: all 6 combinations (linux/darwin/windows x amd64/arm64)
    # are valid, including windows/arm64 (supported by Go's toolchain
    # since Go 1.17, and there is a growing base of arm64 Windows
    # devices, e.g. Surface Pro X/11, that this build serves).
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: ogrep
    ids:
      - ogrep
    # Explicit rather than relying on goreleaser's default (which also
    # happens to be zip-for-windows/tar.gz-otherwise) so the intent is
    # documented here rather than left implicit.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      # Glob patterns (as opposed to bare filenames) that match zero
      # files are silently skipped by goreleaser rather than failing
      # the build; a bare "LICENSE" with no glob metacharacter errors
      # out if missing. Kept as a glob (rather than tightened to the
      # literal "LICENSE" now that one exists) so the archive build
      # doesn't start failing if the file is ever renamed/reformatted
      # (e.g. LICENSE.txt, LICENSE.md).
      - README*
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# This repo has no git remote yet, so goreleaser's default assumption
# that it should infer a GitHub/GitLab/Gitea remote from `git remote`
# and publish a release there cannot work locally: even
# `--snapshot --skip=publish` fails `goreleaser check` with "no remote
# configured to list refs from" unless the release pipe is disabled.
#
# But unconditionally disabling the release pipe would also break the
# whole point of running goreleaser from a tag-triggered GitHub Actions
# workflow (see .github/workflows/release.yml), where a real remote and
# GITHUB_TOKEN *will* exist once this repo is pushed to GitHub. So
# `disable` is a Go template evaluated per-run instead of a static
# `true`/`false` — this is a documented goreleaser idiom for
# conditionally disabling a pipe (see e.g. their own
# `disable: '{{ ne .Branch "main" }}'` example). GitHub Actions sets
# GITHUB_ACTIONS=true in the environment for every run it executes, and
# that variable is absent everywhere else (including this sandbox), so:
#   - GITHUB_ACTIONS != "true"  ->  disable evaluates true  -> local/
#     sandbox runs keep today's working no-remote dry-run behavior.
#   - GITHUB_ACTIONS == "true"  ->  disable evaluates false -> real CI
#     runs actually attempt the release, using the remote + token that
#     only exist there.
#
# The condition is written with `index .Env "GITHUB_ACTIONS"` rather
# than the more obvious `.Env.GITHUB_ACTIONS` dot-access: empirically
# (verified with `goreleaser check`), dot-accessing a *completely unset*
# env var here behaves differently from an explicitly-set-but-empty one
# and defeats the whole point of the conditional in exactly the
# no-GITHUB_ACTIONS sandbox case this is meant to handle. `index` is
# also goreleaser's own documented pattern for optional env vars (see
# their env-with-default template cookbook), and it's what was actually
# validated below, so it's what's used here rather than the seemingly-
# equivalent dot-access form.
# No `dockers:`, `brews:`, etc. blocks are configured either, since
# those aren't part of this project's release surface.
release:
  disable: '{{ if eq (index .Env "GITHUB_ACTIONS") "true" }}false{{ else }}true{{ end }}'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
